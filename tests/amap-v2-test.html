<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMap v2 test</title>
    <style>
      html, body, #map { margin: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      window.__amapStatus = "loading";
      window.__amapError = null;
      window.__onAmapError = function (event) {
        window.__amapStatus = "error";
        window.__amapError = JSON.stringify(event && event.error || event);
      };
    </script>
    <script
      src="https://webapi.amap.com/maps?v=2.0&key=YOUR_AMAP_KEY"
      onerror="window.__amapStatus='script-error'"
    ></script>
    <script>
      try {
        const map = new AMap.Map("map", {
          zoom: 12,
          center: [118.7969, 32.0603]
        });
        new AMap.Marker({ position: [118.7969, 32.0603], map });
        window.__amapStatus = "ok";
        window.__amapMap = map;
      } catch (error) {
        window.__amapStatus = "exception";
        window.__amapError = String(error && error.stack || error);
      }
    </script>
  </body>
</html>
