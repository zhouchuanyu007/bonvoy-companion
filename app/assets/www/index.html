<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0F2843" />
    <meta
      name="description"
      content="旅伴，面向万豪旅享家会员的离线优先旅行决策工具。"
    />
    <title>旅伴 · 万豪会员出行助手</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <header class="app-header" id="app-header"></header>
      <main class="app-main" id="app-main" tabindex="-1"></main>
      <nav class="bottom-nav" id="bottom-nav" aria-label="主导航"></nav>
    </div>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <section
      class="sheet"
      id="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheet-title"
      hidden
    ></section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>请开启 JavaScript 以使用旅伴。</noscript>
    <script src="catalog.js"></script>
    <script src="hotel-prices.js"></script>
    <script src="app-data.js"></script>
    <script src="logic.js"></script>
    <script src="hotel-insights.js"></script>
    <script src="app.js"></script>
  </body>
</html>
